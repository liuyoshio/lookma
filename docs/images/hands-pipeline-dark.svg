<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The hands pipeline</title>
<desc id="d">Every hands call (see, click, drag, type, key, scroll, open) runs six steps: resolve the target, grant (a card the first time in an app), attention (did you use the keyboard or mouse in the last 3 seconds), mark (ring, label and ghost cursor, about 350 ms early), act, and observe (list the app's elements). If you are idle, the target comes to the front. If you are busy, nothing takes the front: safe steps run in the background and the rest wait for go ahead. Every step returns the app's elements to the agent, with a screenshot only when asked.</desc>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.2 1.2L8.8 5L1.2 8.8Z" fill="#77727C"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/></filter>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="0" y="0" width="1000" height="410" rx="18" fill="#18181C"/>
<text x="20" y="57" font-size="15" font-weight="700" fill="#F2EEEA">Every hands call</text>
<rect x="168" y="40" width="44" height="24" rx="12" fill="#232328" stroke="#36363E" stroke-width="1"/><text x="190" y="56.5" font-size="12.5" fill="#F2EEEA" text-anchor="middle">see</text><rect x="220" y="40" width="59" height="24" rx="12" fill="#232328" stroke="#36363E" stroke-width="1"/><text x="249.5" y="56.5" font-size="12.5" fill="#F2EEEA" text-anchor="middle">click</text><rect x="287" y="40" width="52" height="24" rx="12" fill="#232328" stroke="#36363E" stroke-width="1"/><text x="313" y="56.5" font-size="12.5" fill="#F2EEEA" text-anchor="middle">drag</text><rect x="347" y="40" width="52" height="24" rx="12" fill="#232328" stroke="#36363E" stroke-width="1"/><text x="373" y="56.5" font-size="12.5" fill="#F2EEEA" text-anchor="middle">type</text><rect x="407" y="40" width="44" height="24" rx="12" fill="#232328" stroke="#36363E" stroke-width="1"/><text x="429" y="56.5" font-size="12.5" fill="#F2EEEA" text-anchor="middle">key</text><rect x="459" y="40" width="66" height="24" rx="12" fill="#232328" stroke="#36363E" stroke-width="1"/><text x="492" y="56.5" font-size="12.5" fill="#F2EEEA" text-anchor="middle">scroll</text><rect x="533" y="40" width="52" height="24" rx="12" fill="#232328" stroke="#36363E" stroke-width="1"/><text x="559" y="56.5" font-size="12.5" fill="#F2EEEA" text-anchor="middle">open</text>
<text x="599" y="57" font-size="15" fill="#C9C3BD">runs the same six steps, one at a time.</text>
<rect x="20" y="92" width="147" height="112" rx="14" fill="#232328" stroke="#36363E" stroke-width="1.2" filter="url(#soft)"/><circle cx="44" cy="120" r="12" fill="#3A2620"/><text x="44" y="124.5" font-size="12.5" font-weight="700" fill="#FF8F6E" text-anchor="middle">1</text><text x="64" y="125.5" font-size="16.5" font-weight="700" fill="#F2EEEA">Resolve</text><text x="34" y="158" font-size="13" fill="#C9C3BD">element id, point,</text><text x="34" y="179" font-size="13" fill="#C9C3BD">Dock icon, or app</text><path d="M169 148L180.1 148" fill="none" stroke="#77727C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="182.6" y="92" width="147" height="112" rx="14" fill="#232328" stroke="#36363E" stroke-width="1.2" filter="url(#soft)"/><circle cx="206.6" cy="120" r="12" fill="#3A2620"/><text x="206.6" y="124.5" font-size="12.5" font-weight="700" fill="#FF8F6E" text-anchor="middle">2</text><text x="226.6" y="125.5" font-size="16.5" font-weight="700" fill="#F2EEEA">Grant</text><text x="196.6" y="158" font-size="13" fill="#C9C3BD">first time in this</text><text x="196.6" y="179" font-size="13" fill="#C9C3BD">app? one card</text><path d="M331.6 148L342.70000000000005 148" fill="none" stroke="#77727C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="345.2" y="92" width="147" height="112" rx="14" fill="#232328" stroke="#36363E" stroke-width="1.2" filter="url(#soft)"/><circle cx="369.2" cy="120" r="12" fill="#3A2620"/><text x="369.2" y="124.5" font-size="12.5" font-weight="700" fill="#FF8F6E" text-anchor="middle">3</text><text x="389.2" y="125.5" font-size="16.5" font-weight="700" fill="#F2EEEA">Attention</text><text x="359.2" y="158" font-size="13" fill="#C9C3BD">keys or mouse used</text><text x="359.2" y="179" font-size="13" fill="#C9C3BD">in the last 3 s?</text><path d="M494.2 148L505.3 148" fill="none" stroke="#77727C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="507.79999999999995" y="92" width="147" height="112" rx="14" fill="#232328" stroke="#FF805C" stroke-width="2" filter="url(#soft)"/><circle cx="531.8" cy="120" r="12" fill="#FF805C"/><text x="531.8" y="124.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="551.8" y="125.5" font-size="16.5" font-weight="700" fill="#F2EEEA">Mark</text><text x="521.8" y="158" font-size="13" fill="#C9C3BD">ring, label, ghost,</text><text x="521.8" y="179" font-size="13" fill="#C9C3BD">~350 ms early</text><path d="M656.8 148L667.9 148" fill="none" stroke="#77727C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="670.4" y="92" width="147" height="112" rx="14" fill="#232328" stroke="#36363E" stroke-width="1.2" filter="url(#soft)"/><circle cx="694.4" cy="120" r="12" fill="#3A2620"/><text x="694.4" y="124.5" font-size="12.5" font-weight="700" fill="#FF8F6E" text-anchor="middle">5</text><text x="714.4" y="125.5" font-size="16.5" font-weight="700" fill="#F2EEEA">Act</text><text x="684.4" y="158" font-size="13" fill="#C9C3BD">AX press, or input</text><text x="684.4" y="179" font-size="13" fill="#C9C3BD">that lands on target</text><path d="M819.4 148L830.5 148" fill="none" stroke="#77727C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="833" y="92" width="147" height="112" rx="14" fill="#232328" stroke="#36363E" stroke-width="1.2" filter="url(#soft)"/><circle cx="857" cy="120" r="12" fill="#3A2620"/><text x="857" y="124.5" font-size="12.5" font-weight="700" fill="#FF8F6E" text-anchor="middle">6</text><text x="877" y="125.5" font-size="16.5" font-weight="700" fill="#F2EEEA">Observe</text><text x="847" y="158" font-size="13" fill="#C9C3BD">list the app’s</text><text x="847" y="179" font-size="13" fill="#C9C3BD">elements</text>
<path d="M398.7 208C398.7 250 350 236 350 262" fill="none" stroke="#77727C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
<path d="M438.7 208C438.7 250 650 236 650 262" fill="none" stroke="#77727C" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="170" y="266" width="300" height="80" rx="14" fill="#1E1E23" stroke="#36363E" stroke-width="1.2"/>
<text x="186" y="292" font-size="15.5" font-weight="700" fill="#F2EEEA">You’re idle</text>
<text x="186" y="315" font-size="14" fill="#C9C3BD">The target comes to the front,</text>
<text x="186" y="333" font-size="14" fill="#C9C3BD">and the step runs in plain sight.</text>
<rect x="530" y="266" width="300" height="80" rx="14" fill="#1E1E23" stroke="#36363E" stroke-width="1.2"/>
<circle cx="552" cy="287" r="5" fill="#FFD60A"/>
<text x="564" y="292" font-size="15.5" font-weight="700" fill="#F2EEEA">You’re busy</text>
<text x="546" y="315" font-size="14" fill="#C9C3BD">Nothing takes the front. Safe steps</text>
<text x="546" y="333" font-size="14" fill="#C9C3BD">run behind you; the rest wait.</text>
<text x="980" y="384" font-size="14" text-anchor="end"><tspan fill="#8F8A93">Back to the agent: </tspan><tspan fill="#C9C3BD">what was done, then the app’s elements; a screenshot only when asked.</tspan></text>
</svg>
