<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" width="1000" height="558" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Hand gestures</title>
<desc id="d">The camera macOS prefers sends 30 frames a second to Apple's Vision on this Mac, which finds 21 joints per hand. One gesture engine turns them into events, and the gesture output turns each event into input on your Mac (scroll, Command-Tab, Command-equals and Command-minus) or into the overlay's talk key, stop and hand dot. Five gestures: pinch and move up or down to scroll the window under the pointer; pinch and flick sideways to switch apps, sliding to step and opening the hand to pick; pinch with both hands and spread or close them to zoom; raise an open palm and hold it still to hold the talk key; push the open palm toward the camera to stop the work and the voice. Any other hand does nothing: a pinch counts only when made in view, and a hand far from the camera is ignored.</desc>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.2 1.2L8.8 5L1.2 8.8Z" fill="#9A918A"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.2 1.2L8.8 5L1.2 8.8Z" fill="#4F4A46"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/></filter>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="0" y="0" width="1000" height="558" rx="18" fill="#F7F2EC"/>
<text x="32" y="44" font-size="19" font-weight="700" fill="#1B1B1F">Hand gestures</text>
<text x="32" y="68" font-size="13.5" fill="#4F4A46">Off unless you turn them on. Frames are read on this Mac and dropped: no image, hand or gesture is stored or sent.</text>
<rect x="20" y="92" width="150" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="36" y="126" font-size="16" font-weight="700" fill="#1B1B1F">Camera</text><text x="36" y="156" font-size="13" fill="#4F4A46">the one you prefer</text><text x="36" y="176" font-size="13" fill="#4F4A46">in macOS, 30 fps</text><path d="M172 148L201.5 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="204" y="92" width="150" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="220" y="126" font-size="16" font-weight="700" fill="#1B1B1F">Vision</text><text x="220" y="156" font-size="13" fill="#4F4A46">21 joints per hand,</text><text x="220" y="176" font-size="13" fill="#4F4A46">on this Mac</text><path d="M356 148L385.5 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="388" y="92" width="150" height="112" rx="14" fill="#FFFFFF" stroke="#FF805C" stroke-width="2" filter="url(#soft)"/><text x="404" y="126" font-size="16" font-weight="700" fill="#1B1B1F">Gesture engine</text><text x="404" y="156" font-size="13" fill="#4F4A46">pinch or palm,</text><text x="404" y="176" font-size="13" fill="#4F4A46">one state machine</text><path d="M540 148L569.5 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="572" y="92" width="150" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="588" y="126" font-size="16" font-weight="700" fill="#1B1B1F">Gesture output</text><text x="588" y="156" font-size="13" fill="#4F4A46">one table from</text><text x="588" y="176" font-size="13" fill="#4F4A46">event to action</text>
<rect x="768" y="92" width="212" height="52" rx="14" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1.2"/><text x="782" y="114" font-size="14" font-weight="700" fill="#1B1B1F">Your Mac</text><text x="782" y="133" font-size="12.5" fill="#4F4A46">scroll, ⌘Tab, ⌘= and ⌘−</text><rect x="768" y="152" width="212" height="52" rx="14" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1.2"/><text x="782" y="174" font-size="14" font-weight="700" fill="#1B1B1F">The overlay</text><text x="782" y="193" font-size="12.5" fill="#4F4A46">the talk key, stop, the dot</text><path d="M724 148C746 148 744 118 765 118" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M724 148C746 148 744 178 765 178" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
<text x="20" y="246" font-size="11.5" font-weight="700" fill="#857D77" letter-spacing="1.4">A PINCH HOLDS THE MAC, AN OPEN PALM TALKS TO LOOKMA</text>
<rect x="20" y="260" width="182" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="30" y="272" width="162" height="96" rx="10" fill="#FBF8F4"/><circle cx="111" cy="320" r="11" fill="#FF805C" fill-opacity="0.5" filter="url(#glow)"/><circle cx="111" cy="320" r="7.5" fill="#FF805C" stroke="#fff" stroke-width="1.5"/><path d="M111 304L111 282" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M111 336L111 358" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><text x="36" y="400" font-size="15.5" font-weight="700" fill="#1B1B1F">Scroll</text><text x="36" y="422" font-size="13" fill="#4F4A46">Pinch, then move up</text><text x="36" y="441" font-size="13" fill="#4F4A46">or down. The window</text><text x="36" y="460" font-size="13" fill="#4F4A46">under the pointer</text><text x="36" y="479" font-size="13" fill="#4F4A46">follows your hand.</text><rect x="214.5" y="260" width="182" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="224.5" y="272" width="162" height="96" rx="10" fill="#FBF8F4"/><circle cx="257.5" cy="342" r="11" fill="#FF805C" fill-opacity="0.5" filter="url(#glow)"/><circle cx="257.5" cy="342" r="7.5" fill="#FF805C" stroke="#fff" stroke-width="1.5"/><path d="M273.5 342L307.5 342" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><rect x="301.5" y="288" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><rect x="331.5" y="288" width="24" height="24" rx="6" fill="#FDE9E0" stroke="#FF805C" stroke-width="2"/><rect x="361.5" y="288" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="230.5" y="400" font-size="15.5" font-weight="700" fill="#1B1B1F">Switch apps</text><text x="230.5" y="422" font-size="13" fill="#4F4A46">Pinch and flick right</text><text x="230.5" y="441" font-size="13" fill="#4F4A46">for the next app, left</text><text x="230.5" y="460" font-size="13" fill="#4F4A46">for the last. Slide to</text><text x="230.5" y="479" font-size="13" fill="#4F4A46">step; open to pick.</text><rect x="409" y="260" width="182" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="419" y="272" width="162" height="96" rx="10" fill="#FBF8F4"/><circle cx="478" cy="320" r="11" fill="#FF805C" fill-opacity="0.5" filter="url(#glow)"/><circle cx="478" cy="320" r="7.5" fill="#FF805C" stroke="#fff" stroke-width="1.5"/><circle cx="522" cy="320" r="11" fill="#FF805C" fill-opacity="0.5" filter="url(#glow)"/><circle cx="522" cy="320" r="7.5" fill="#FF805C" stroke="#fff" stroke-width="1.5"/><path d="M464 320L436 320" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M536 320L564 320" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><text x="425" y="400" font-size="15.5" font-weight="700" fill="#1B1B1F">Zoom</text><text x="425" y="422" font-size="13" fill="#4F4A46">Pinch with both hands,</text><text x="425" y="441" font-size="13" fill="#4F4A46">then spread them to</text><text x="425" y="460" font-size="13" fill="#4F4A46">zoom in or close them</text><text x="425" y="479" font-size="13" fill="#4F4A46">to zoom out.</text><rect x="603.5" y="260" width="182" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="613.5" y="272" width="162" height="96" rx="10" fill="#FBF8F4"/><g transform="translate(682.5 328) scale(1.15)" fill="#4F4A46"><rect x="-13" y="-4" width="26" height="26" rx="9"/><rect x="-13" y="-24" width="6" height="24" rx="3"/><rect x="-6.5" y="-28" width="6" height="28" rx="3"/><rect x="0" y="-25" width="6" height="25" rx="3"/><rect x="6.8" y="-19" width="5.6" height="20" rx="2.8"/><rect x="-19" y="0" width="6.5" height="18" rx="3.25" transform="rotate(-32 -13 16)"/></g><g transform="translate(716.5 302) scale(1.625)" fill="none" stroke="#FF805C" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.2 8a4.8 4.8 0 0 0 9.6 0M8 12.8v1.8"/></g><text x="619.5" y="400" font-size="15.5" font-weight="700" fill="#1B1B1F">Talk</text><text x="619.5" y="422" font-size="13" fill="#4F4A46">Raise an open palm and</text><text x="619.5" y="441" font-size="13" fill="#4F4A46">hold it still: the talk</text><text x="619.5" y="460" font-size="13" fill="#4F4A46">key is down. Lower it</text><text x="619.5" y="479" font-size="13" fill="#4F4A46">to let go.</text><rect x="798" y="260" width="182" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="808" y="272" width="162" height="96" rx="10" fill="#FBF8F4"/><g transform="translate(851 330) scale(0.8)" fill="#4F4A46" opacity="0.35"><rect x="-13" y="-4" width="26" height="26" rx="9"/><rect x="-13" y="-24" width="6" height="24" rx="3"/><rect x="-6.5" y="-28" width="6" height="28" rx="3"/><rect x="0" y="-25" width="6" height="25" rx="3"/><rect x="6.8" y="-19" width="5.6" height="20" rx="2.8"/><rect x="-19" y="0" width="6.5" height="18" rx="3.25" transform="rotate(-32 -13 16)"/></g><path d="M871 324L891 324" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><g transform="translate(925 326) scale(1.3)" fill="#4F4A46"><rect x="-13" y="-4" width="26" height="26" rx="9"/><rect x="-13" y="-24" width="6" height="24" rx="3"/><rect x="-6.5" y="-28" width="6" height="28" rx="3"/><rect x="0" y="-25" width="6" height="25" rx="3"/><rect x="6.8" y="-19" width="5.6" height="20" rx="2.8"/><rect x="-19" y="0" width="6.5" height="18" rx="3.25" transform="rotate(-32 -13 16)"/></g><text x="814" y="400" font-size="15.5" font-weight="700" fill="#1B1B1F">Stop</text><text x="814" y="422" font-size="13" fill="#4F4A46">Push the open palm</text><text x="814" y="441" font-size="13" fill="#4F4A46">toward the camera: the</text><text x="814" y="460" font-size="13" fill="#4F4A46">work stops, and the</text><text x="814" y="479" font-size="13" fill="#4F4A46">voice with it.</text>
<text x="32" y="532" font-size="13.5"><tspan font-weight="700" fill="#1B1B1F">Any other hand does nothing</tspan><tspan fill="#4F4A46">: a pinch counts only when you make it in view, and a hand far from the camera is ignored.</tspan></text>
</svg>
