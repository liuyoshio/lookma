<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" width="1000" height="566" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Hand gestures</title>
<desc id="d">The camera runs in the overlay page, where MediaPipe's hand landmarker finds 21 points of your hand in each frame, on this Mac. Only those points go to the app: its gesture engine decides what the mouse should do, and a 120 Hz pointer loop moves the real mouse there, eased, and still while the hand is still. Four states: point with an open hand, and the pointer follows the base of your ring finger; pinch thumb and index to press the button, for a click, a double-click or a drag; pinch thumb and middle and move up or down to scroll the window under the pointer, where a flick coasts; make a fist or drop your hand to park, and the pointer stays and a held button lets go. A hand never opened flat in view moves nothing, and a pinch carried into view presses nothing.</desc>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.2 1.2L8.8 5L1.2 8.8Z" fill="#9A918A"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.2 1.2L8.8 5L1.2 8.8Z" fill="#4F4A46"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/></filter>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="0" y="0" width="1000" height="566" rx="18" fill="#F7F2EC"/>
<text x="32" y="44" font-size="19" font-weight="700" fill="#1B1B1F">Hand gestures: your hand is the mouse</text>
<text x="32" y="68" font-size="13.5" fill="#4F4A46">Off unless you turn them on. Frames stay in the page on this Mac; only the hand's points go on. Nothing is stored or sent.</text>
<text x="20" y="100" font-size="11.5" font-weight="700" fill="#857D77" letter-spacing="1.4">IN THE OVERLAY PAGE</text><text x="460" y="100" font-size="11.5" font-weight="700" fill="#857D77" letter-spacing="1.4">IN THE APP</text>
<rect x="20" y="112" width="156" height="104" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="36" y="144" font-size="16" font-weight="700" fill="#1B1B1F">Camera</text><text x="36" y="172" font-size="13" fill="#4F4A46">in the overlay</text><text x="36" y="192" font-size="13" fill="#4F4A46">page, 30 fps</text><path d="M178 164L199.5 164" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="202" y="112" width="156" height="104" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="218" y="144" font-size="16" font-weight="700" fill="#1B1B1F">MediaPipe</text><text x="218" y="172" font-size="13" fill="#4F4A46">hand landmarker,</text><text x="218" y="192" font-size="13" fill="#4F4A46">on this Mac</text><path d="M360 164L457.5 164" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="460" y="112" width="156" height="104" rx="14" fill="#FFFFFF" stroke="#FF805C" stroke-width="2" filter="url(#soft)"/><text x="476" y="144" font-size="16" font-weight="700" fill="#1B1B1F">Gesture engine</text><text x="476" y="172" font-size="13" fill="#4F4A46">open, pinch or</text><text x="476" y="192" font-size="13" fill="#4F4A46">fist, per frame</text><path d="M618 164L639.5 164" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="642" y="112" width="156" height="104" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="658" y="144" font-size="16" font-weight="700" fill="#1B1B1F">Pointer loop</text><text x="658" y="172" font-size="13" fill="#4F4A46">120 Hz, eased;</text><text x="658" y="192" font-size="13" fill="#4F4A46">a still hand rests</text><path d="M800 164L821.5 164" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="824" y="112" width="156" height="104" rx="14" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1.2"/><text x="840" y="144" font-size="16" font-weight="700" fill="#1B1B1F">Your Mac</text><text x="840" y="172" font-size="13" fill="#4F4A46">the real mouse:</text><text x="840" y="192" font-size="13" fill="#4F4A46">point, click, scroll</text>
<text x="409" y="152" font-size="12.5" font-weight="700" fill="#C94A24" text-anchor="middle">21 points</text><text x="409" y="188" font-size="12.5" fill="#857D77" text-anchor="middle">a frame</text>
<text x="20" y="254" font-size="11.5" font-weight="700" fill="#857D77" letter-spacing="1.4">AN OPEN HAND IS ON THE MOUSE, A FIST LIFTS IT OFF</text>
<rect x="20" y="268" width="225" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="30" y="280" width="205" height="96" rx="10" fill="#FBF8F4"/><g transform="translate(102.5 334) scale(1.15)" fill="#4F4A46"><rect x="-13" y="-4" width="26" height="26" rx="9"/><rect x="-13" y="-24" width="6" height="24" rx="3"/><rect x="-6.5" y="-28" width="6" height="28" rx="3"/><rect x="0" y="-25" width="6" height="25" rx="3"/><rect x="6.8" y="-19" width="5.6" height="20" rx="2.8"/><rect x="-19" y="0" width="6.5" height="18" rx="3.25" transform="rotate(-32 -13 16)"/></g><circle cx="106.5" cy="331" r="4.5" fill="none" stroke="#FF805C" stroke-width="2.2"/><path d="M126.5 324L154.5 310" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><g transform="translate(160.5 298) scale(1)"><path d="M0 0v20.5l5.1-5 3.3 7.6 3.3-1.4-3.2-7.5h7z" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="1.5" stroke-linejoin="round"/></g><text x="36" y="408" font-size="15.5" font-weight="700" fill="#1B1B1F">Point</text><text x="36" y="430" font-size="13" fill="#4F4A46">Open your hand: the pointer</text><text x="36" y="449" font-size="13" fill="#4F4A46">follows the base of your</text><text x="36" y="468" font-size="13" fill="#4F4A46">ring finger. A still hand</text><text x="36" y="487" font-size="13" fill="#4F4A46">is a still pointer.</text><rect x="265" y="268" width="225" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="275" y="280" width="205" height="96" rx="10" fill="#FBF8F4"/><circle cx="343.5" cy="334" r="11" fill="#FF805C" fill-opacity="0.5" filter="url(#glow)"/><circle cx="343.5" cy="334" r="7.5" fill="#FF805C" stroke="#fff" stroke-width="1.5"/><path d="M359.5 334L399.5 334" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><g transform="translate(403.5 322) scale(1)"><path d="M0 0v20.5l5.1-5 3.3 7.6 3.3-1.4-3.2-7.5h7z" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="1.5" stroke-linejoin="round"/></g><text x="281" y="408" font-size="15.5" font-weight="700" fill="#1B1B1F">Click and drag</text><text x="281" y="430" font-size="13" fill="#4F4A46">Pinch thumb and index to</text><text x="281" y="449" font-size="13" fill="#4F4A46">press, part them to let go.</text><text x="281" y="468" font-size="13" fill="#4F4A46">Pinch twice to double-click;</text><text x="281" y="487" font-size="13" fill="#4F4A46">move while pinched to drag.</text><rect x="510" y="268" width="225" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="520" y="280" width="205" height="96" rx="10" fill="#FBF8F4"/><circle cx="622.5" cy="328" r="11" fill="#FF805C" fill-opacity="0.5" filter="url(#glow)"/><circle cx="622.5" cy="328" r="7.5" fill="#FF805C" stroke="#fff" stroke-width="1.5"/><path d="M622.5 312L622.5 290" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M622.5 344L622.5 366" fill="none" stroke="#4F4A46" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1)"/><text x="526" y="408" font-size="15.5" font-weight="700" fill="#1B1B1F">Scroll</text><text x="526" y="430" font-size="13" fill="#4F4A46">Pinch thumb and middle,</text><text x="526" y="449" font-size="13" fill="#4F4A46">then move up or down. The</text><text x="526" y="468" font-size="13" fill="#4F4A46">window under the pointer</text><text x="526" y="487" font-size="13" fill="#4F4A46">follows; a flick coasts.</text><rect x="755" y="268" width="225" height="238" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><rect x="765" y="280" width="205" height="96" rx="10" fill="#FBF8F4"/><g transform="translate(845.5 332) scale(1.25)" fill="#4F4A46"><rect x="-14" y="-8" width="28" height="28" rx="9"/><rect x="-14" y="-15" width="6.6" height="12" rx="3.3"/><rect x="-7" y="-15" width="6.6" height="12" rx="3.3"/><rect x="0" y="-15" width="6.6" height="12" rx="3.3"/><rect x="7" y="-15" width="6.6" height="12" rx="3.3"/><rect x="-17" y="2" width="22" height="7" rx="3.5" fill="#857D77"/></g><g transform="translate(889.5 314) scale(1)"><path d="M0 0v20.5l5.1-5 3.3 7.6 3.3-1.4-3.2-7.5h7z" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="1.5" stroke-linejoin="round"/></g><text x="771" y="408" font-size="15.5" font-weight="700" fill="#1B1B1F">Park</text><text x="771" y="430" font-size="13" fill="#4F4A46">Make a fist or drop your</text><text x="771" y="449" font-size="13" fill="#4F4A46">hand. The pointer stays</text><text x="771" y="468" font-size="13" fill="#4F4A46">where it is, and a held</text><text x="771" y="487" font-size="13" fill="#4F4A46">button lets go.</text>
<text x="32" y="540" font-size="13.5"><tspan font-weight="700" fill="#1B1B1F">Nothing by accident</tspan><tspan fill="#4F4A46">: a hand never opened flat in view moves nothing, and a pinch carried in presses nothing.</tspan></text>
</svg>
