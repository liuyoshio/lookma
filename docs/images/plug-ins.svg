<text x="50" y="64" font-size="12.5" fill="#857D77" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">LOOKMA_VOICE=openai | off</text>
<text x="950" y="42" font-size="17" font-weight="700" fill="#1B1B1F" text-anchor="end">Swap the agent</text>
