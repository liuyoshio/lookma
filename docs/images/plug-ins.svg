<rect x="66" y="372" width="288" height="88" rx="12" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1.2"/><text x="82" y="398" font-size="14.5" font-weight="700" fill="#1B1B1F" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">mint.mjs</text><text x="338" y="398" font-size="12.5" fill="#857D77" text-anchor="end">in the core</text><text x="82" y="422" font-size="13" fill="#4F4A46">mint(ctx) → a short-lived grant</text><text x="82" y="443" font-size="13" fill="#857D77">the real key never leaves the core</text>
<rect x="630" y="204" width="320" height="270" rx="14" fill="#FFFFFF" stroke="#FF805C" stroke-width="1.6" stroke-dasharray="6 4"/><text x="646" y="230" font-size="14" font-weight="700" fill="#C94A24" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">executors/&lt;name&gt;/</text><rect x="822" y="213" width="112" height="24" rx="12" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1"/><text x="878" y="229.5" font-size="12.5" fill="#4F4A46" text-anchor="middle">manifest.mjs</text>
<rect x="646" y="248" width="288" height="212" rx="12" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1.2"/><text x="662" y="274" font-size="14.5" font-weight="700" fill="#1B1B1F" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">index.mjs</text><text x="918" y="274" font-size="12.5" fill="#857D77" text-anchor="end">in the core</text><text x="662" y="298" font-size="12.5" fill="#1B1B1F" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">create(ctx)</text><text x="662" y="319" font-size="13" fill="#4F4A46">↓ start · prompt · interrupt · close</text><text x="662" y="340" font-size="12.5" fill="#4F4A46">↑ turnStart · turnEnd · step · task · down</text><text x="662" y="361" font-size="13" fill="#4F4A46">ctx.ask(): a card for you</text><text x="662" y="382" font-size="13" fill="#4F4A46">ctx.tools.mcp(): say and the hands</text>
<text x="662" y="444" font-size="12.5" fill="#857D77">readiness, stop and restart: the host’s</text>
