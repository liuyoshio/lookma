<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" width="1000" height="572" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">What Lookma shows on screen</title>
<desc id="d">A desktop with a map app. A coral ring and a ghost cursor sit on the search field, with a step label under it. An approval card asks "Allow controlling Jot?" above the capsule, which shows your words, what it is doing and its status. A strip below shows the yellow tab at the screen edge, "Waiting to use Jot", with a Go ahead button.</desc>
