rl(#glow)"/><path d="M2 2v20.5l5.1-5 3.3 7.6 3.3-1.4-3.2-7.5h7z" fill="#fff" stroke="#FF805C" stroke-width="1.6" stroke-linejoin="round"/></g>
</g><rect x="210.5" y="24.5" width="579" height="439" rx="12" fill="none" stroke="#36363E" stroke-width="1"/><text x="194" y="92" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="end">Coral ring</text><text x="194" y="110.5" font-size="13.5" fill="#C9C3BD" text-anchor="end">Lands on the target</text><text x="194" y="128" font-size="13.5" fill="#C9C3BD" text-anchor="end">a beat before it acts.</text><path d="M204 87L238 106" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="238" cy="106" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="194" y="172" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="end">Step label</text><text x="194" y="190.5" font-size="13.5" fill="#C9C3BD" text-anchor="end">What this step does,</text><text x="194" y="208" font-size="13.5" fill="#C9C3BD" text-anchor="end">in your language.</text><path d="M204 167L261 152" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="261" cy="152" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="194" y="292" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="end">Approval card</text><text x="194" y="310.5" font-size="13.5" fill="#C9C3BD" text-anchor="end">Comes with a chime.</text><text x="194" y="328" font-size="13.5" fill="#C9C3BD" text-anchor="end">Answer out loud or click.</text><path d="M204 287L337 284" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="337" cy="284" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="194" y="392" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="end">Capsule</text><text x="194" y="410.5" font-size="13.5" fill="#C9C3BD" text-anchor="end">Grows while it works,</text><text x="194" y="428" font-size="13.5" fill="#C9C3BD" text-anchor="end">then shrinks away.</text><path d="M204 387L271 400" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="271" cy="400" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="806" y="40" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="start">Menu bar</text><text x="806" y="58.5" font-size="13.5" fill="#C9C3BD" text-anchor="start">Listen, Pause (⌃⌥P),</text><text x="806" y="76" font-size="13.5" fill="#C9C3BD" text-anchor="start">Type a Request…, Quit.</text><path d="M796 35L776 35" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="776" cy="35" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="806" y="128" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="start">Ghost cursor</text><text x="806" y="146.5" font-size="13.5" fill="#C9C3BD" text-anchor="start">The agent’s hand.</text><text x="806" y="164" font-size="13.5" fill="#C9C3BD" text-anchor="start">Your cursor stays yours.</text><path d="M796 123L435 127" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="435" cy="127" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="806" y="330" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="start">Your words</text><text x="806" y="348.5" font-size="13.5" fill="#C9C3BD" text-anchor="start">As it heard them, so a</text><text x="806" y="366" font-size="13.5" fill="#C9C3BD" text-anchor="start">mishearing shows at once.</text><path d="M796 325L706 380" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="706" cy="380" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="806" y="400" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="start">Doing</text><text x="806" y="418.5" font-size="13.5" fill="#C9C3BD" text-anchor="start">The exact request</text><text x="806" y="436" font-size="13.5" fill="#C9C3BD" text-anchor="start">handed to the agent.</text><path d="M796 395L702 401" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="702" cy="401" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="806" y="462" font-size="14.5" font-weight="700" fill="#F2EEEA" text-anchor="start">Status</text><text x="806" y="480.5" font-size="13.5" fill="#C9C3BD" text-anchor="start">The current step.</text><path d="M796 457L644 427" fill="none" stroke="#F2EEEA" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="644" cy="427" r="3.6" fill="#F2EEEA" stroke="#232328" stroke-width="1.8"/><text x="210" y="516" font-size="14.5" font-weight="700" fill="#F2EEEA">While you type</text><text x="210" y="534.5" font-size="13.5" fill="#C9C3BD">The marks step aside. A yellow tab says</text><text x="210" y="552" font-size="13.5" fill="#C9C3BD">where it works, or that it waits for you.</text><clipPath id="strip-c"><rect x="460" y="498" width="330" height="54" rx="10"/></clipPath>
