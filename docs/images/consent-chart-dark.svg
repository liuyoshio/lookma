<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 418" width="1000" height="418" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Voice approvals, with and without the gate</title>
<desc id="d">Bar chart. The voice model alone approved a lone "approve?" asked back 15 of 15 times, a "go ahead" said 0.3 seconds after the card 11 of 16 times, and its own leaked voice 4 of 12 times. With Lookma's consent gate, 0 of 169 must-not cases were approved.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/></filter>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="0" y="0" width="1000" height="418" rx="18" fill="#18181C"/>
<text x="32" y="48" font-size="19" font-weight="700" fill="#F2EEEA">A voice model alone says yes too easily</text>
<text x="32" y="72" font-size="13" fill="#C9C3BD">Times it approved a card although the person had not said yes. From the voice-approval experiment.</text>
<text x="32" y="112" font-size="11.5" font-weight="700" fill="#8F8A93" letter-spacing="1.4">THE VOICE MODEL ALONE</text>
<line x1="32" y1="122" x2="968" y2="122" stroke="#36363E"/>
<text x="32" y="156" font-size="14.5" font-weight="600" fill="#F2EEEA">A lone “approve?”, asked back</text><text x="32" y="175" font-size="12.5" fill="#8F8A93">said as a question, rising tone</text><rect x="450" y="145" width="400" height="18" rx="4" fill="#2C2C33"/><path d="M450 145h396a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-396z" fill="#E9603A"/><text x="864" y="159" font-size="13.5" fill="#F2EEEA"><tspan font-weight="700">15 of 15</tspan><tspan fill="#8F8A93">  100%</tspan></text>
<text x="32" y="212" font-size="14.5" font-weight="600" fill="#F2EEEA">“Go ahead”, 0.3 s after the card</text><text x="32" y="231" font-size="12.5" fill="#8F8A93">meant for something else</text><rect x="450" y="201" width="400" height="18" rx="4" fill="#2C2C33"/><path d="M450 201h271a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-271z" fill="#E9603A"/><text x="864" y="215" font-size="13.5" fill="#F2EEEA"><tspan font-weight="700">11 of 16</tspan><tspan fill="#8F8A93">  69%</tspan></text>
<text x="32" y="268" font-size="14.5" font-weight="600" fill="#F2EEEA">Its own voice, leaking into the mic</text><text x="32" y="287" font-size="12.5" fill="#8F8A93">the assistant hears itself</text><rect x="450" y="257" width="400" height="18" rx="4" fill="#2C2C33"/><path d="M450 257h129.33333333333334a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-129.33333333333334z" fill="#E9603A"/><text x="864" y="271" font-size="13.5" fill="#F2EEEA"><tspan font-weight="700">4 of 12</tspan><tspan fill="#8F8A93">  33%</tspan></text>
<text x="32" y="324" font-size="11.5" font-weight="700" fill="#8F8A93" letter-spacing="1.4">WITH LOOKMA’S CONSENT GATE</text>
<line x1="32" y1="334" x2="968" y2="334" stroke="#36363E"/>
<text x="32" y="368" font-size="14.5" font-weight="600" fill="#F2EEEA">Every must-not case</text>
<text x="32" y="387" font-size="12.5" fill="#8F8A93">4 runs × 52: no, wait, echoes, too early</text>
<rect x="450" y="357" width="400" height="18" rx="4" fill="#2C2C33"/>
<text x="864" y="371" font-size="13.5" fill="#F2EEEA"><tspan font-weight="700">0 of 169</tspan><tspan fill="#8F8A93">  0%</tspan></text>
<circle cx="466" cy="366" r="11" fill="#34C759"/>
<path d="M460.5 366l3.8 3.8 6.6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="486" y="371" font-size="13.5" font-weight="600" fill="#4CD964">never approved</text>
</svg>
