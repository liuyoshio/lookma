<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The hands pipeline</title>
<desc id="d">Every hands call (see, click, drag, type, key, scroll, open) runs six steps: resolve the target, grant (a card the first time in an app), attention (did you use the keyboard or mouse in the last 3 seconds), mark (ring, label and ghost cursor, about 350 ms early), act, and observe (list the app's elements). If you are idle, the target comes to the front. If you are busy, nothing takes the front: safe steps run in the background and the rest wait for go ahead. Every step returns the app's elements to the agent, with a screenshot only when asked.</desc>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.2 1.2L8.8 5L1.2 8.8Z" fill="#9A918A"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/></filter>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="0" y="0" width="1000" height="410" rx="18" fill="#F7F2EC"/>
<text x="20" y="57" font-size="15" font-weight="700" fill="#1B1B1F">Every hands call</text>
<rect x="168" y="40" width="44" height="24" rx="12" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="190" y="56.5" font-size="12.5" fill="#1B1B1F" text-anchor="middle">see</text><rect x="220" y="40" width="59" height="24" rx="12" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="249.5" y="56.5" font-size="12.5" fill="#1B1B1F" text-anchor="middle">click</text><rect x="287" y="40" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="313" y="56.5" font-size="12.5" fill="#1B1B1F" text-anchor="middle">drag</text><rect x="347" y="40" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="373" y="56.5" font-size="12.5" fill="#1B1B1F" text-anchor="middle">type</text><rect x="407" y="40" width="44" height="24" rx="12" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="429" y="56.5" font-size="12.5" fill="#1B1B1F" text-anchor="middle">key</text><rect x="459" y="40" width="66" height="24" rx="12" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="492" y="56.5" font-size="12.5" fill="#1B1B1F" text-anchor="middle">scroll</text><rect x="533" y="40" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1"/><text x="559" y="56.5" font-size="12.5" fill="#1B1B1F" text-anchor="middle">open</text>
<text x="599" y="57" font-size="15" fill="#4F4A46">runs the same six steps, one at a time.</text>
<rect x="20.0" y="92" width="147" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><circle cx="44.0" cy="120" r="12" fill="#FDE9E0"/><text x="44.0" y="124.5" font-size="12.5" font-weight="700" fill="#C94A24" text-anchor="middle">1</text><text x="64.0" y="125.5" font-size="16.5" font-weight="700" fill="#1B1B1F">Resolve</text><text x="34.0" y="158" font-size="13" fill="#4F4A46">element id, point,</text><text x="34.0" y="179" font-size="13" fill="#4F4A46">Dock icon, or app</text><path d="M169.0 148L180.1 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="182.6" y="92" width="147" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><circle cx="206.6" cy="120" r="12" fill="#FDE9E0"/><text x="206.6" y="124.5" font-size="12.5" font-weight="700" fill="#C94A24" text-anchor="middle">2</text><text x="226.6" y="125.5" font-size="16.5" font-weight="700" fill="#1B1B1F">Grant</text><text x="196.6" y="158" font-size="13" fill="#4F4A46">first time in this</text><text x="196.6" y="179" font-size="13" fill="#4F4A46">app? one card</text><path d="M331.6 148L342.7 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="345.2" y="92" width="147" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><circle cx="369.2" cy="120" r="12" fill="#FDE9E0"/><text x="369.2" y="124.5" font-size="12.5" font-weight="700" fill="#C94A24" text-anchor="middle">3</text><text x="389.2" y="125.5" font-size="16.5" font-weight="700" fill="#1B1B1F">Attention</text><text x="359.2" y="158" font-size="13" fill="#4F4A46">keys or mouse used</text><text x="359.2" y="179" font-size="13" fill="#4F4A46">in the last 3 s?</text><path d="M494.2 148L505.3 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="507.8" y="92" width="147" height="112" rx="14" fill="#FFFFFF" stroke="#FF805C" stroke-width="2" filter="url(#soft)"/><circle cx="531.8" cy="120" r="12" fill="#FF805C"/><text x="531.8" y="124.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="551.8" y="125.5" font-size="16.5" font-weight="700" fill="#1B1B1F">Mark</text><text x="521.8" y="158" font-size="13" fill="#4F4A46">ring, label, ghost,</text><text x="521.8" y="179" font-size="13" fill="#4F4A46">~350 ms early</text><path d="M656.8 148L667.9 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="670.4" y="92" width="147" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><circle cx="694.4" cy="120" r="12" fill="#FDE9E0"/><text x="694.4" y="124.5" font-size="12.5" font-weight="700" fill="#C94A24" text-anchor="middle">5</text><text x="714.4" y="125.5" font-size="16.5" font-weight="700" fill="#1B1B1F">Act</text><text x="684.4" y="158" font-size="13" fill="#4F4A46">AX press, or input</text><text x="684.4" y="179" font-size="13" fill="#4F4A46">that lands on target</text><path d="M819.4 148L830.5 148" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="833.0" y="92" width="147" height="112" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><circle cx="857.0" cy="120" r="12" fill="#FDE9E0"/><text x="857.0" y="124.5" font-size="12.5" font-weight="700" fill="#C94A24" text-anchor="middle">6</text><text x="877.0" y="125.5" font-size="16.5" font-weight="700" fill="#1B1B1F">Observe</text><text x="847.0" y="158" font-size="13" fill="#4F4A46">list the app's</text><text x="847.0" y="179" font-size="13" fill="#4F4A46">elements</text>
<path d="M399 208C399 250 342 236 342 262" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
<path d="M439 208C439 250 642 236 642 262" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="162" y="266" width="300" height="80" rx="14" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1.2"/>
<text x="178" y="292" font-size="15.5" font-weight="700" fill="#1B1B1F">You’re idle</text>
<text x="178" y="315" font-size="14" fill="#4F4A46">The target comes to the front,</text>
<text x="178" y="333" font-size="14" fill="#4F4A46">and the step runs in plain sight.</text>
<rect x="522" y="266" width="300" height="80" rx="14" fill="#FBF8F4" stroke="#E3D9CF" stroke-width="1.2"/>
<circle cx="544" cy="287" r="5" fill="#FFD60A"/>
<text x="556" y="292" font-size="15.5" font-weight="700" fill="#1B1B1F">You’re busy</text>
<text x="538" y="315" font-size="14" fill="#4F4A46">Nothing takes the front. Safe steps</text>
<text x="538" y="333" font-size="14" fill="#4F4A46">run behind you; the rest wait.</text>
<text x="980" y="384" font-size="14" text-anchor="end"><tspan fill="#857D77">Back to the agent: </tspan><tspan fill="#4F4A46">what was done, then the app's elements; a screenshot only when asked.</tspan></text>
</svg>
