<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" width="1000" height="612" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Where approval cards come from</title>
<desc id="d">Three sources raise the same approval card: the Lookma core the first time it touches an app, a Claude Code tool permission, and a Codex request to go beyond its sandbox. You answer by voice, through a consent gate that needs an explicit yes, or by clicking. The answer goes back the way the question came.</desc>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.2 1.2L8.8 5L1.2 8.8Z" fill="#9A918A"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/></filter>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="0" y="0" width="1000" height="612" rx="18" fill="#F7F2EC"/>
<rect x="20" y="24" width="300" height="156" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="38" y="50" font-size="11.5" font-weight="700" fill="#C94A24" letter-spacing="1.4">LOOKMA CORE</text><text x="38" y="77" font-size="16.5" font-weight="700" fill="#1B1B1F">First time in an app</text><text x="38" y="100" font-size="14" fill="#4F4A46">“Allow controlling Jot?”</text><line x1="38" y1="118" x2="302" y2="118" stroke="#E3D9CF"/><text x="38" y="140" font-size="12.5" fill="#857D77">The answer goes back</text><text x="38" y="161" font-size="14" fill="#4F4A46">The waiting step goes on, or fails.</text>
<rect x="350" y="24" width="300" height="156" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="368" y="50" font-size="11.5" font-weight="700" fill="#C94A24" letter-spacing="1.4">CLAUDE CODE</text><text x="368" y="77" font-size="16.5" font-weight="700" fill="#1B1B1F">A tool permission</text><text x="368" y="100" font-size="14" fill="#4F4A46">“Run this command?”</text><line x1="368" y1="118" x2="632" y2="118" stroke="#E3D9CF"/><text x="368" y="140" font-size="12.5" fill="#857D77">The answer goes back</text><text x="368" y="161" font-size="14" fill="#4F4A46">Allow or deny, this call only.</text>
<rect x="680" y="24" width="300" height="156" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/><text x="698" y="50" font-size="11.5" font-weight="700" fill="#C94A24" letter-spacing="1.4">CODEX</text><text x="698" y="77" font-size="16.5" font-weight="700" fill="#1B1B1F">Beyond its sandbox</text><text x="698" y="100" font-size="14" fill="#4F4A46">A command, a file change</text><line x1="698" y1="118" x2="962" y2="118" stroke="#E3D9CF"/><text x="698" y="140" font-size="12.5" fill="#857D77">The answer goes back</text><text x="698" y="161" font-size="14" fill="#4F4A46">Accept or decline, this once.</text>
<path d="M170 184C170 222 400 214 410 246" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/>
<path d="M500 184L500 246" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/>
<path d="M830 184C830 222 600 214 590 246" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/>
<ellipse cx="500" cy="304" rx="200" ry="70" fill="#FF805C" fill-opacity=".16" filter="url(#blur)"/>
<rect x="340" y="252" width="320" height="104" rx="16" fill="#1C1C21" fill-opacity="0.97" stroke="#fff" stroke-opacity="0.17" stroke-width="0.6" filter="url(#shadow)"/><circle cx="357" cy="272" r="3" fill="#fff" fill-opacity="0.85"/><text x="366" y="276" font-size="11" fill="#fff" fill-opacity="0.55">Needs your approval</text><text x="354" y="301" font-size="15" font-weight="600" fill="#fff">Allow controlling Jot?</text><g transform="translate(353 324) scale(0.8125)" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.2 8a4.8 4.8 0 0 0 9.6 0M8 12.8v1.8"/></g><text x="370" y="335" font-size="11.5" fill="#fff" fill-opacity="0.62">Say “yes, I approve”</text><rect x="504" y="319" width="66" height="25" rx="7" fill="#fff" fill-opacity="0.13"/><text x="537" y="335.5" font-size="12" fill="#fff" text-anchor="middle" fill-opacity="0.92">Decline</text><rect x="576" y="319" width="70" height="25" rx="7" fill="#fff" fill-opacity="0.94"/><text x="611" y="335.5" font-size="12" font-weight="600" fill="#1D1D1F" text-anchor="middle">Approve</text>
<text x="20" y="288" font-size="16.5" font-weight="700" fill="#1B1B1F">One card, whatever asked.</text>
<text x="20" y="311" font-size="14" fill="#4F4A46">Approve always means “this once”,</text>
<text x="20" y="330" font-size="14" fill="#4F4A46">never “always allow”.</text>
<text x="980" y="288" font-size="16.5" font-weight="700" fill="#1B1B1F" text-anchor="end">It chimes, so you notice.</text>
<text x="980" y="311" font-size="14" fill="#4F4A46" text-anchor="end">A stop withdraws</text>
<text x="980" y="330" font-size="14" fill="#4F4A46" text-anchor="end">every open card.</text>
<rect x="120" y="392" width="390" height="60" rx="14" fill="#FDE9E0" stroke="#FF805C" stroke-width="1.2"/>
<path d="M148 407l8 3v6c0 5-3.5 8-8 9.5c-4.5-1.5-8-4.5-8-9.5v-6z" fill="#FF805C"/>
<text x="166" y="418" font-size="15" font-weight="700" fill="#1B1B1F">Consent gate</text>
<text x="140" y="440" font-size="13.5" fill="#4F4A46">explicit yes · 1 s after the card · not its own echo</text>
<path d="M315 390L430 360" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="120" y="486" width="400" height="106" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/>
<g transform="translate(140 503) scale(1.125)" fill="none" stroke="#1B1B1F" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.2 8a4.8 4.8 0 0 0 9.6 0M8 12.8v1.8"/></g>
<text x="166" y="518" font-size="16.5" font-weight="700" fill="#1B1B1F">Say it</text>
<text x="226" y="518" font-size="13.5" fill="#857D77">English or Chinese</text>
<rect x="140" y="540" width="164" height="26" rx="13" fill="#FBF8F4" stroke="#E3D9CF"/><text x="152" y="558" font-size="13.5" fill="#1B1B1F">“yes, I approve”</text><circle cx="289" cy="553" r="7.5" fill="#34C759"/><path d="M285.5 553l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="306" y="540" width="72" height="26" rx="13" fill="#FBF8F4" stroke="#E3D9CF"/><text x="318" y="558" font-size="13.5" fill="#1B1B1F">“ok”</text><circle cx="363" cy="553" r="7.5" fill="#857D77" fill-opacity="0.5"/><path d="M360 550l6 6m0-6l-6 6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
<rect x="390" y="540" width="118" height="26" rx="13" fill="#FBF8F4" stroke="#E3D9CF"/><text x="402" y="558" font-size="13.5" fill="#1B1B1F">“approve?”</text><circle cx="493" cy="553" r="7.5" fill="#857D77" fill-opacity="0.5"/><path d="M490 550l6 6m0-6l-6 6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
<path d="M315 482L315 456" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
<rect x="560" y="486" width="320" height="106" rx="14" fill="#FFFFFF" stroke="#E3D9CF" stroke-width="1.2" filter="url(#soft)"/>
<path d="M582 500v17.5l4.4-4.3 2.8 6.5 2.8-1.2-2.7-6.4h6z" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="1.4" stroke-linejoin="round"/>
<text x="606" y="518" font-size="16.5" font-weight="700" fill="#1B1B1F">Or click</text>
<text x="580" y="547" font-size="14" fill="#4F4A46">Approve or Decline on the card.</text>
<text x="580" y="568" font-size="14" fill="#4F4A46">Always works, in any language.</text>
<path d="M720 482L590 360" fill="none" stroke="#9A918A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah0)"/>
</svg>
