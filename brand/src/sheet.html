<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lookma brand sheet</title>
<style>
  :root { --coral:#FF805C; --deep:#E9603A; --ink:#1B1B1F;
          --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box }
  html, body { width:1600px; height:1760px; overflow:hidden; font-family:var(--sans) }
  .panel { position:relative; height:880px; padding:44px 56px; display:grid; grid-template-columns:400px 1fr; gap:0 48px }
  .light { --bg:#F7F2EC; --fg:#1B1B1F; --muted:#8C847E; --rule:rgba(0,0,0,.08);
           --bar:#ECE9E5; --barline:rgba(0,0,0,.10); --strip:#E4DFD9; --tab:#FFFFFF; --glyph:none; background:var(--bg); color:var(--fg) }
  .dark  { --bg:#232327; --fg:#F2EEEA; --muted:#8E8A92; --rule:rgba(255,255,255,.08);
           --bar:#313136; --barline:rgba(255,255,255,.06); --strip:#1A1A1D; --tab:#38383E; --glyph:invert(1); background:var(--bg); color:var(--fg) }

  .eyebrow { font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--muted) }
  .eyebrow b { color:var(--coral) }
  .hero { display:flex; flex-direction:column }
  .hero img { width:400px; height:400px; margin-top:34px }
  .name { margin-top:22px; font-size:56px; font-weight:800; letter-spacing:-.04em; line-height:1 }
  .lines { margin-top:14px; font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.35 }
  .lines span { display:block }
  .lines .second { color:var(--deep) }
  .file { margin-top:auto; font:12px ui-monospace, Menlo, monospace; color:var(--muted) }

  .rows { display:flex; flex-direction:column; gap:30px; padding-top:2px }
  .row h3 { font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;
            padding-bottom:10px; border-bottom:1px solid var(--rule) }
  .row h3 code { font:500 11px ui-monospace, Menlo, monospace; letter-spacing:0; text-transform:none; margin-left:10px }
  .items { display:flex; align-items:flex-end; gap:28px }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px }
  .item span { font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--muted); white-space:nowrap }
  .px { image-rendering:pixelated }
  .vsep { width:1px; align-self:stretch; background:var(--rule) }

  .bar { display:flex; align-items:center; gap:14px; background:var(--bar); border-bottom:1px solid var(--barline); border-radius:6px;
         padding:0 14px; font-size:13px; font-weight:500 }
  .bar.x1 { height:24px }
  .bar.x2 { height:48px; gap:28px; padding:0 28px; font-size:26px; border-radius:12px }
  .bar img { filter:var(--glyph); display:block }
  .bar .clock { margin-left:6px; opacity:.85 }

  .strip { background:var(--strip); border-radius:10px; padding:8px 8px 0; display:flex }
  .tab { background:var(--tab); border-radius:8px 8px 0 0; height:34px; padding:0 14px; display:flex; align-items:center; gap:8px;
         font-size:13px; font-weight:500; width:200px }
  .tab i { margin-left:auto; font-style:normal; opacity:.4 }
  .social { width:420px; height:210px; border-radius:10px; box-shadow:0 0 0 1px var(--rule) }
</style></head>
<body>
<script>
  // one panel per theme, built from the same markup
  const panel = (theme) => `
  <section class="panel ${theme}">
    <div class="hero">
      <div class="eyebrow"><b>Lookma</b> &nbsp;/&nbsp; brand &nbsp;/&nbsp; ${theme}</div>
      <img src="seal.svg" alt="">
      <div class="name">Hands</div>
      <div class="lines"><span>Look ma, no hands.</span><span class="second">No approval, no seal.</span></div>
      <div class="file">seal.svg</div>
    </div>
    <div class="rows">
      <div class="row"><h3>App icon<code>AppIcon.icns · icon.svg · icon-small.svg</code></h3>
        <div class="items">
          <div class="item"><img src="AppIcon.iconset/icon_128x128@2x.png" width="256" height="256"><span>256</span></div>
          <div class="item"><img src="AppIcon.iconset/icon_128x128.png" width="128" height="128"><span>128</span></div>
          <div class="item"><img src="AppIcon.iconset/icon_32x32@2x.png" width="64" height="64"><span>64</span></div>
          <div class="item"><img src="AppIcon.iconset/icon_32x32.png" width="32" height="32"><span>32</span></div>
          <div class="item"><img src="AppIcon.iconset/icon_16x16.png" width="16" height="16"><span>16</span></div>
          <div class="vsep"></div>
          <div class="item"><img class="px" src="AppIcon.iconset/icon_32x32.png" width="128" height="128"><span>32 PX &times;4</span></div>
          <div class="item"><img class="px" src="AppIcon.iconset/icon_16x16.png" width="128" height="128"><span>16 PX &times;8</span></div>
        </div>
      </div>
      <div class="row"><h3>Menu bar<code>menubar.png · menubar@2x.png · menubar-paused.png · menubar-paused@2x.png</code></h3>
        <div class="items">
          <div class="item"><div class="bar x1"><img src="menubar.png" width="18" height="18"><img src="menubar-paused.png" width="18" height="18"><span class="clock">Thu 9:41</span></div><span>1&times; &middot; ACTIVE, PAUSED</span></div>
          <div class="item"><div class="bar x2"><img src="menubar@2x.png" width="36" height="36"><img src="menubar-paused@2x.png" width="36" height="36"><span class="clock">Thu 9:41</span></div><span>2&times; PIXELS, SHOWN AT 2&times;</span></div>
          <div class="vsep"></div>
          <div class="item"><img class="px bar-glyph" src="menubar.png" width="72" height="72" style="filter:var(--glyph)"><span>18 PX &times;4</span></div>
          <div class="item"><img class="px" src="menubar-paused.png" width="72" height="72" style="filter:var(--glyph)"><span>PAUSED &times;4</span></div>
        </div>
      </div>
      <div class="row"><h3>Favicon &amp; social<code>favicon.svg · social.png</code></h3>
        <div class="items">
          <div class="item"><div class="strip"><div class="tab"><img src="favicon.svg" width="16" height="16">Lookma<i>&times;</i></div></div><span>TAB, 16</span></div>
          <div class="item"><img src="favicon.svg" width="32" height="32"><span>32</span></div>
          <div class="item"><img src="favicon.svg" width="64" height="64"><span>64</span></div>
          <div class="vsep"></div>
          <div class="item"><img class="social" src="social.png"><span>1280 &times; 640</span></div>
        </div>
      </div>
    </div>
  </section>`;
  document.body.innerHTML = panel('light') + panel('dark');
</script>
</body></html>
