<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookma overlay</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="ov">
  <!-- focus marks: where the agent is working -->
  <div id="ring"></div>
  <div id="drop"></div>
  <div id="path"></div>
  <div id="flabel" class="glass"><i class="dot"></i><span class="tx"></span></div>
  <div id="ripple"></div>
  <svg id="ghost" viewBox="0 0 20 28" aria-hidden="true"><path d="M2 2v20.5l5.1-5 3.3 7.6 3.3-1.4-3.2-7.5h7z"/></svg>

  <!-- your hand, with Hand Gestures on -->
  <div id="hand"></div>

  <!-- the user is busy: the agent works in the background, or waits for the front -->
  <div id="edge" class="glass">
    <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M6.5 1.5 3 5l3.5 3.5"/></svg>
    <i class="dot"></i><span class="tx"></span>
    <button id="goAhead" class="e-btn" type="button">Go ahead</button>
  </div>

  <!-- bottom stack: approval card, typed input, background tasks, turn capsule -->
  <div id="stack">
    <div id="card" class="glass" role="dialog" aria-label="Approval" hidden>
      <div class="k-head"><i class="dot"></i><span>Needs your approval</span><span class="k-more"></span></div>
      <div class="k-q"></div>
      <div class="k-d"></div>
      <div class="k-act">
        <div class="k-hint"></div>
        <button class="k-btn" type="button" data-allow="false">Decline</button>
        <button class="k-btn primary" type="button" data-allow="true">Approve</button>
      </div>
    </div>
    <form id="typed" class="glass" autocomplete="off" hidden>
      <input id="typedInput" placeholder="Type an instruction, Enter to send" aria-label="Type an instruction">
    </form>
    <div id="tasks"></div>
    <div id="cap" class="glass min">
      <div id="capIn">
        <div class="vg off" id="vg"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i></div>
        <div class="rows">
          <div class="r-prev"></div>
          <div class="r-user"></div>
          <div class="r-sent"></div>
          <div class="r-status"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
